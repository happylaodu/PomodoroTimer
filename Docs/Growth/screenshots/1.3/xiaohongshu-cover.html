<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书封面 - Pomodoro Timer Lite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'SF Pro SC', 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(135deg, #FF6B9D 0%, #FFA06B 50%, #FFE66D 100%);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 50px;
        }

        .header {
            text-align: left;
        }

        .emoji-title {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .main-section {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: -100px;
        }

        .mega-title {
            font-size: 140px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
            letter-spacing: -4px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .highlight {
            font-size: 100px;
            font-weight: 900;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px 60px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        .subtitle {
            font-size: 42px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        .screenshot-wrapper {
            margin-top: 40px;
        }

        .screenshot {
            max-width: 420px;
            max-height: 550px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
        }

        .tags {
            text-align: center;
            padding-bottom: 20px;
        }

        .tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            margin: 0 10px 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.35);
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 25px;
            border-radius: 12px;
            font-size: 15px;
            max-width: 350px;
            z-index: 1000;
            line-height: 1.6;
        }

        .instructions h3 {
            margin-bottom: 12px;
            font-size: 18px;
            color: #FF6B9D;
        }

        .instructions ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .instructions button {
            margin-top: 10px;
            background: linear-gradient(135deg, #FF6B9D, #FFA06B);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
        }

        .instructions button:hover {
            opacity: 0.9;
        }

        .instructions.hidden {
            display: none;
        }

        .instructions code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="header">
                <h1 class="emoji-title">🍅 Mac效率神器</h1>
            </div>

            <div class="main-section">
                <h2 class="subtitle">最轻量番茄钟</h2>
                <div class="highlight">1.5MB</div>

                <div class="screenshot-wrapper">
                    <img src="hero-screenshot.png" alt="Pomodoro Timer Lite 界面" class="screenshot" id="screenshot">
                </div>
            </div>

            <div class="tags">
                <span class="tag">#免费</span>
                <span class="tag">#开源</span>
                <span class="tag">#无广告</span>
            </div>
        </div>
    </div>

    <div class="instructions" id="instructions">
        <h3>📸 截图步骤：</h3>
        <ol>
            <li>确保 <code>hero-screenshot.png</code> 在此目录</li>
            <li>点击下方按钮隐藏此提示</li>
            <li>按 <kbd>Cmd+Shift+4</kbd> 然后按<kbd>空格</kbd></li>
            <li>点击浏览器窗口截图</li>
        </ol>
        <p style="margin: 10px 0; color: #FFE66D;">💡 建议尺寸：1080×1350（3:4比例）</p>
        <button onclick="hideInstructions()">隐藏提示，开始截图 ✨</button>
    </div>

    <script>
        function hideInstructions() {
            document.getElementById('instructions').classList.add('hidden');
        }

        const screenshot = document.getElementById('screenshot');
        screenshot.onerror = function() {
            console.log('未找到 hero-screenshot.png，将显示空白区域');
        };
    </script>
</body>
</html>
