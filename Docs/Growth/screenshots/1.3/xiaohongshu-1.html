<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书配图1 - 仅需 1.5MB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'SF Pro SC', 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 1080px;
            height: 1440px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .text-section {
            position: absolute;
            top: 180px;
            left: 80px;
            max-width: 600px;
            z-index: 10;
        }

        .main-title {
            font-size: 96px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            letter-spacing: -3px;
        }

        .subtitle {
            font-size: 44px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.4;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin-right: 15px;
            margin-top: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.35);
        }

        .screenshot-wrapper {
            position: absolute;
            bottom: 100px;
            right: 80px;
        }

        .screenshot {
            max-width: 550px;
            max-height: 800px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.4);
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 25px;
            border-radius: 12px;
            font-size: 15px;
            max-width: 350px;
            z-index: 1000;
            line-height: 1.6;
        }

        .instructions h3 {
            margin-bottom: 12px;
            font-size: 18px;
            color: #FFE66D;
        }

        .instructions ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .instructions button {
            margin-top: 10px;
            background: linear-gradient(135deg, #FF6B6B, #FFE66D);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
        }

        .instructions button:hover {
            opacity: 0.9;
        }

        .instructions.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-section">
            <h1 class="main-title">仅需 1.5MB</h1>
            <p class="subtitle">Mac 上最轻量的番茄钟</p>
            <div>
                <span class="badge">免费开源</span>
                <span class="badge">无广告</span>
                <span class="badge">零追踪</span>
            </div>
        </div>

        <div class="screenshot-wrapper">
            <img src="hero-screenshot.png" alt="Pomodoro Timer Lite 主界面" class="screenshot" id="screenshot">
        </div>
    </div>

    <div class="instructions" id="instructions">
        <h3>📸 截图步骤：</h3>
        <ol>
            <li>确保 <code>hero-screenshot.png</code> 在此目录</li>
            <li>点击下方按钮隐藏此提示</li>
            <li>按 <kbd>Cmd+Shift+4</kbd> 然后按<kbd>空格</kbd></li>
            <li>点击浏览器窗口截图</li>
        </ol>
        <p style="margin: 10px 0; color: #FFE66D;">💡 小红书图文第1张</p>
        <button onclick="hideInstructions()">隐藏提示，开始截图 ✨</button>
    </div>

    <script>
        function hideInstructions() {
            document.getElementById('instructions').classList.add('hidden');
        }

        const screenshot = document.getElementById('screenshot');
        screenshot.onerror = function() {
            console.log('未找到 hero-screenshot.png');
        };
    </script>
</body>
</html>
